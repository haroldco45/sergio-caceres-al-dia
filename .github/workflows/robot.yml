name: Robot de noticias

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: robot
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Traer noticias y videos
        run: node scripts/robot.mjs
      - name: Guardar cambios
        run: |
          git config user.name "Robot Vibras Positivas HM"
          git config user.email "actions@github.com"
          git add data/
          git diff --cached --quiet || (git commit -m "Robot: noticias al día $(TZ=America/Bogota date '+%Y-%m-%d %H:%M')" && git push)
